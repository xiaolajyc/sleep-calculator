<script>
'use strict';
const APP_VERSION='V10.0';
const CURRENT_KEY='sleepCalculator.current.v3';
const HISTORY_KEY='sleepCalculator.history.v3';
const LONG_H_KEY='sleepCalculator.longTermHours';
const LONG_M_KEY='sleepCalculator.longTermMinutes';
const DRIVE_CLIENT_ID='801960562511-885mk42o96piugu8egtp93ldhrt6ilgp.apps.googleusercontent.com';
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const DRIVE_FILE_NAME='sleep-calculator-sync-v1.json';
const DRIVE_AUTO_KEY='sleepCalculator.driveAutoSync.v1';
const DRIVE_FILE_KEY='sleepCalculator.driveFileId.v1';
let state={tab:localStorage.getItem('sleepCalculator.activeTab')||'today', current:loadCurrent(), history:loadHistory()};
let driveToken=null,driveTokenExpiresAt=0,driveGISPromise=null,driveBusy=false,driveAutoTimer=null,driveFileId=localStorage.getItem(DRIVE_FILE_KEY)||null;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function localDate(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function timeNow(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function dt(date,time){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{2}:\d{2}$/.test(time))return null;const d=new Date(`${date}T${time}:00`);return isNaN(d)?null:d}
function fmtDate(iso,withYear=false){const d=new Date(iso);if(isNaN(d))return '';return withYear?`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`:`${d.getMonth()+1}/${d.getDate()}`}
function fmtDT(iso){const d=new Date(iso);return isNaN(d)?'':`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function mins(a,b){return Math.round((new Date(b)-new Date(a))/60000)}
function dur(m){m=Math.max(0,Math.round(m));const h=Math.floor(m/60),r=m%60;if(h&&r)return `${h}小时${r}分钟`;if(h)return `${h}小时`;return `${r}分钟`}
function durShort(m){m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?`${h}h${r?` ${r}m`:''}`:`${r}m`}
function signedDur(m){return m===0?'0分钟':m>0?`+${dur(m)}`:`-${dur(-m)}`}
function durationParts(){const h=Number(localStorage.getItem(LONG_H_KEY));const m=Number(localStorage.getItem(LONG_M_KEY));return [Number.isInteger(h)&&h>=0?h:8,Number.isInteger(m)&&m>=0&&m<60?m:15]}
function longTarget(){const [h,m]=durationParts();return h*60+m}
function saveCurrent(){localStorage.setItem(CURRENT_KEY,JSON.stringify(state.current||null))}
function loadCurrent(){try{const x=JSON.parse(localStorage.getItem(CURRENT_KEY)||'null');return x&&typeof x==='object'?x:null}catch{return null}}
function saveHistory(){localStorage.setItem(HISTORY_KEY,JSON.stringify(state.history));if(typeof driveScheduleAutoSync==='function')driveScheduleAutoSync()}
function normalizeHistory(arr){if(!Array.isArray(arr))return [];return arr.map(x=>{const e={...x};if(!e.id)e.id=`${Date.now()}-${Math.random()}`;if(!Array.isArray(e.naps))e.naps=[];if(!Array.isArray(e.wakes))e.wakes=[];if(!e.sleepDuration&&e.mainSleepDuration)e.sleepDuration=e.mainSleepDuration;return e})}
function loadHistory(){try{return normalizeHistory(JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'))}catch{return []}}
function getBalance(){const target=longTarget();return state.history.reduce((s,e)=>s+(parseDuration(e.sleepDuration)||0)-target,0)}
function parseDuration(s){const m=String(s||'').match(/^(?:(\d+)小时)?(?:(\d+)分钟)?$/);return m&& (m[1]||m[2])?Number(m[1]||0)*60+Number(m[2]||0):null}
function nextTarget(){return Math.max(60,Math.min(1440,longTarget()-getBalance()))}
function setLongTarget(h,m){h=Math.max(0,Math.min(24,Number(h)||0));m=Math.max(0,Math.min(59,Number(m)||0));if(h===0&&m===0){h=8;m=15}localStorage.setItem(LONG_H_KEY,String(Math.floor(h)));localStorage.setItem(LONG_M_KEY,String(Math.floor(m)))}
function setCurrentDefaults(){const now=new Date();const next=nextTarget();state.current={startDate:localDate(now),startTime:timeNow(),targetMinutes:next,wakes:[],finalWakeDate:localDate(now),finalWakeTime:timeNow(),naps:[],createdAt:new Date().toISOString()};saveCurrent()}
function ensureCurrent(){if(!state.current)setCurrentDefaults()}
function dateFromInput(id, fallback){return $(id)?.value||fallback}
function currentTarget(){return Number(state.current?.targetMinutes)||nextTarget()}
function currentMainStart(){const c=state.current;if(!c)return null;return dt(c.startDate,c.startTime)}
function currentMainEnd(){const c=state.current;if(!c)return null;return dt(c.finalWakeDate,c.finalWakeTime)}
function computeCurrent(){const c=state.current;if(!c||!c.startDate||!c.startTime||!c.finalWakeDate||!c.finalWakeTime)return null;const start=currentMainStart(),end=currentMainEnd();if(!start||!end)return null;if(end<=start)throw new Error('最终起床时间必须晚于首次入睡时间，请检查日期和时间');let awake=0;const wakes=[];(c.wakes||[]).forEach((p,i)=>{const w=dt(p.wakeDate||c.startDate,p.wakeTime),a=dt(p.againDate||p.wakeDate||c.startDate,p.againTime);if(!w||!a)throw new Error(`第 ${i+1} 次起夜时间不完整`);if(a<=w)throw new Error(`第 ${i+1} 次再次入睡时间必须晚于醒来时间`);if(w<start||a>end)throw new Error(`第 ${i+1} 次起夜必须发生在首次入睡与最终起床之间`);awake+=mins(w,a);wakes.push({wake:w.toISOString(),again:a.toISOString(),minutes:mins(w,a)})});const main=Math.max(0,mins(start,end)-awake);const naps=(c.naps||[]).map(n=>{const s=dt(n.startDate,n.startTime),e=dt(n.endDate,n.endTime);if(!s||!e||e<=s)throw new Error('午睡结束时间必须晚于开始时间');return {...n,start:s.toISOString(),end:e.toISOString(),minutes:mins(s,e)}});const napTotal=naps.reduce((s,n)=>s+n.minutes,0);return {start:start.toISOString(),end:end.toISOString(),mainSleepMinutes:main,awakeMinutes:awake,naps,wakes,totalSleepMinutes:main+napTotal,totalElapsedMinutes:mins(start,end)} }
function timelineHtml(data){if(!data)return '';const parts=[];const total=data.totalElapsedMinutes;const start=new Date(data.start),end=new Date(data.end);let cursor=start;for(const w of data.wakes){const ws=new Date(w.wake),we=new Date(w.again);const sleep=mins(cursor,ws);if(sleep>0)parts.push({k:'sleep',m:sleep,label:dur(sleep)});parts.push({k:'awake',m:mins(ws,we),label:dur(mins(ws,we))});cursor=we}const tail=mins(cursor,end);if(tail>0)parts.push({k:'sleep',m:tail,label:dur(tail)});const nap= data.naps||[];const mainBar=parts.map(p=>`<div class="seg ${p.k}" style="flex:${p.m} 0 0" title="${p.label}">${p.m>=90?p.label:''}</div>`).join('');const napBar=nap.map(n=>`<div class="seg nap" style="flex:${n.minutes} 0 0" title="午睡 ${dur(n.minutes)}">${n.minutes>=60?dur(n.minutes):''}</div>`).join('');return `<div class="timeline-labels"><span>${fmtDT(data.start)}</span><span>${fmtDT(data.end)}</span></div><div class="timeline">${mainBar}${napBar}</div><div class="timeline-detail">蓝色：主睡眠　橙色：起夜　绿色：午睡</div>`}
function renderAll(){renderToday();renderRecord();renderHistory();renderStats();renderSettings();switchTab(state.tab,false)}
function switchTab(tab,store=true){state.tab=tab;if(store)localStorage.setItem('sleepCalculator.activeTab',tab);document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(`page-${tab}`).classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));window.scrollTo({top:0,behavior:'instant'})}

function todayEntry(){const today=localDate();return state.history.find(e=>{const d=(e.finalWakeDate||e.end?.slice(0,10)||e.date||'').slice(0,10);const s=(e.startDate||e.start?.slice(0,10)||e.date||'').slice(0,10);return d===today||s===today})||null}

function openNapModal(){const base=localDate();const target=state.current?'当前未完成主睡眠':'最近一条已完成主睡眠';$('modalContent').innerHTML=`<div class="modal-head"><h3>添加午睡</h3><button class="close" id="closeModal">×</button></div><div class="status" style="margin:10px 0">午睡将合并到${target}。${state.current?'':'主睡眠已经保存，也可以直接添加午睡。'}</div><div class="field"><label>开始</label><div class="date-time"><input class="input" id="napStartDate" type="date" value="${base}"><input class="input" id="napStartTime" type="time" value="${timeNow()}"></div></div><div class="field"><label>结束</label><div class="date-time"><input class="input" id="napEndDate" type="date" value="${base}"><input class="input" id="napEndTime" type="time" value="${timeNow()}"></div></div><button class="btn primary" id="saveNapBtn">💾 保存午睡</button>`;$('modal').classList.add('show');$('closeModal').onclick=closeModal;$('saveNapBtn').onclick=saveNapFromModal}

function saveMainRecord(){syncRecordInputs();try{const d=computeCurrent();if(!d)throw new Error('请填写完整的主睡眠和最终起床时间');const target=currentTarget();const duplicate=state.history.some(e=>e.start===d.start&&e.end===d.end);if(duplicate){alert('这条主睡眠已经保存过了。午睡请使用“添加午睡”更新对应记录。');return}const entry={id:`${Date.now()}-${Math.random()}`,date:d.start.slice(0,10),start:d.start,end:d.end,startDate:state.current.startDate,startTime:state.current.startTime,finalWakeDate:state.current.finalWakeDate,finalWakeTime:state.current.finalWakeTime,targetMinutes:target,mainSleepMinutes:d.mainSleepMinutes,awakeMinutes:d.awakeMinutes,wakes:d.wakes,naps:d.naps,totalSleepMinutes:d.totalSleepMinutes,sleepDuration:dur(d.totalSleepMinutes),awakeDuration:dur(d.awakeMinutes),wakeCount:d.wakes.length,createdAt:new Date().toISOString()};state.history.unshift(entry);state.current=null;saveCurrent();saveHistory();const bal=getBalance();toast(`已保存；下一次目标 ${dur(nextTarget())}`);renderAll();switchTab('today');}catch(e){alert(e.message)}}

function renderHistory(){const groups={};state.history.slice().sort((a,b)=>new Date(b.start)-new Date(a.start)).forEach(e=>{const key=(e.startDate||e.date||e.start?.slice(0,10)||'').slice(0,10);(groups[key]??=[]).push(e)});let html=`<div class="topbar"><span class="eyebrow">▤ 历史 · 所有记录</span><h1>历史记录</h1><p>查看、编辑和管理已经保存的睡眠</p></div>`;if(!state.history.length)html+=`<div class="card empty">还没有睡眠记录。</div>`;for(const [day,arr] of Object.entries(groups)){const total=arr.reduce((s,e)=>s+(parseDuration(e.sleepDuration)||0),0),bal=arr.reduce((s,e)=>s+(parseDuration(e.sleepDuration)||0)-(Number(e.targetMinutes)||longTarget()),0);html+=`<div class="history-day"><div class="history-day-head"><div class="history-day-date">${day?fmtDate(day+'T00:00:00',true):'未知日期'} <span style="color:#7b8ba4;font-size:12px">${new Date(day+'T00:00:00').toLocaleDateString('zh-CN',{weekday:'long'})}</span></div><div class="history-day-total">${dur(total)}<small>${signedDur(bal)}</small></div></div>`;arr.forEach(e=>{const naps=e.naps||[];html+=`<div class="history-entry"><div class="entry-line"><div class="entry-icon">🛏️</div><div class="entry-main"><strong>主睡眠　${fmtDT(e.start)} → ${fmtDT(e.end)}</strong><span>${dur(Number(e.mainSleepMinutes)||0)} · 起夜 ${e.wakeCount||e.wakes?.length||0} 次</span></div></div>${naps.map(n=>`<div class="entry-line" style="margin-top:9px"><div class="entry-icon">☀️</div><div class="entry-main"><strong>午睡　${fmtDT(n.start)} → ${fmtDT(n.end)}</strong><span>${dur(Number(n.minutes)||0)}</span></div></div>`).join('')}<div class="item-actions"><span class="chip">目标 ${dur(Number(e.targetMinutes)||longTarget())}</span><span class="chip ${bal>=0?'green':'red'}">本次 ${signedDur((parseDuration(e.sleepDuration)||0)-(Number(e.targetMinutes)||longTarget()))}</span><button class="btn compact" onclick="editHistoryEntry('${esc(e.id)}')">编辑</button><button class="btn danger compact" onclick="deleteHistoryEntry('${esc(e.id)}')">删除</button></div></div>`});html+=`</div>`}$('page-history').in function statsEntries(days){const cutoff=Date.now()-days*86400000;return state.history.filter(e=>new Date(e.start).getTime()>=cutoff)}
function renderStats(){const entries=statsEntries(30);const target=longTarget();let html=`<div class="topbar"><span class="eyebrow">▥ 统计 · 趋势</span><h1>睡眠统计</h1><p>实际睡眠、目标睡眠、盈亏、起夜与午睡</p></div><div class="tabs" id="statsTabs"><button data-days="7">7天</button><button class="active" data-days="30">30天</button><button data-days="90">90天</button><button data-days="365">1年</button></div><div id="statsBody"></div>`;$('page-stats').innerHTML=html;document.querySelectorAll('#statsTabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#statsTabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderStatsBody(Number(b.dataset.days))});renderStatsBody(30)}
function renderStatsBody(days=30){const es=statsEntries(days),target=longTarget();const actual=es.map(e=>parseDuration(e.sleepDuration)||0);const avg=actual.length?Math.round(actual.reduce((a,b)=>a+b,0)/actual.length):0;const balance=actual.reduce((s,x)=>s+x-target,0);const naps=es.flatMap(e=>e.naps||[]),napMin=naps.reduce((s,n)=>s+(Number(n.minutes)||mins(n.start,n.end)),0),awake=es.reduce((s,e)=>s+(Number(e.awakeMinutes)||0),0),wakeCount=es.reduce((s,e)=>s+(Number(e.wakeCount)||e.wakes?.length||0),0);let chart=`<div class="legend"><span><i class="dot blue"></i>实际</span><span><i class="dot light"></i>目标</span></div><div class="chart">`;const recent=es.slice().sort((a,b)=>new Date(a.start)-new Date(b.start)).slice(-Math.min(14,es.length));const max=Math.max(target,...recent.map(e=>parseDuration(e.sleepDuration)||0),60);recent.forEach(e=>{const a=parseDuration(e.sleepDuration)||0;chart+=`<div class="bar-wrap"><div class="bar-stack"><div class="bar target" style="height:${Math.max(2,target/max*135)}px"></div><div class="bar" style="height:${Math.max(2,a/max*135)}px"></div></div><div class="bar-label">${fmtDate(e.start,true)}</div></div>`});if(!recent.length)chart+=`<div class="empty" style="width:100%">暂无数据</div>`;chart+='</div>';let html=`<div class="grid2"><div class="metric"><div class="label">平均实际睡眠</div><div class="value">${actual.length?dur(avg):'—'}</div><div class="sub">${es.length} 次记录</div></div><div class="metric"><div class="label">累计盈亏</div><div class="value" style="color:${balance>=0?'#168260':'#d65353'}">${actual.length?signedDur(balance):'—'}</div><div class="sub">长期目标 ${dur(target)}</div></div></div><div class="card"><div class="section-head"><div class="round">📊</div><div><h2>睡眠趋势</h2><p>最近记录的实际睡眠与目标</p></div></div>${chart}</div><div class="grid2"><div class="metric"><div class="label">🌙 起夜</div><div class="value">${es.length?(wakeCount/es.length).toFixed(1):'—'} 次</div><div class="sub">平均每次睡眠</div></div><div class="metric"><div class="label">☀️ 午睡</div><div class="value">${naps.length} 次</div><div class="sub">共 ${dur(napMin)}</div></div></div><div class="card"><div class="section-head"><div class="round">⏱</div><div><h2>清醒与起夜</h2><p>主睡眠中记录的清醒时间</p></div></div><div class="sleep-summary"><div class="summary-box"><span>平均起夜</span><strong>${es.length?`${(wakeCount/es.length).toFixed(1)} 次`:'—'}</strong></div><div class="summary-box"><span>平均清醒</span><strong>${es.length?dur(Math.round(awake/es.length)):'—'}</strong></div></div></div>`;$('statsBody').innerHTML=html}
function renderSettings(){const [lh,lm]=durationParts();let html=`<div class="topbar"><span class="eyebrow">⚙ 设置 · 目标与数据</span><h1>设置</h1><p>长期目标、同步、数据管理和应用信息</p></div><div class="card"><div class="section-head"><div class="round">🎯</div><div><h2>睡眠目标</h2><p>长期基准决定每次累计盈亏</p></div></div><div class="field"><label>长期睡眠目标</label><div class="duration"><input class="input" id="longH" type="number" min="0" max="24" value="${lh}"><span class="unit">小时</span><input class="input" id="longM" type="number" min="0" max="59" value="${lm}"><span class="unit">分钟</span></div></div><button class="btn primary" id="saveLong">保存长期目标</button><div class="item-sub" style="margin-top:9px">下一次目标 = 长期目标 − 全部历史记录累计盈亏，不使用平均值。</div></div>`;
html+=`<div class="card"><div class="section-head"><div class="round">☁</div><div><h2>Google Drive</h2><p>在手机、电脑等设备之间同步睡眠数据</p></div></div><div id="driveStatus" class="status">${driveTokenValid()?'已连接':'未连接'}</div><div class="drive-actions"><button class="btn primary" id="driveConnect">连接 Google Drive</button><button class="btn secondary" id="driveDisconnect">断开</button><button class="btn primary" id="driveUpload">☁️ 上传/同步</button><button class="btn secondary" id="driveDownload">⬇️ 从云端恢复</button></div><label class="drive-auto"><input type="checkbox" id="driveAutoSync" ${localStorage.getItem(DRIVE_AUTO_KEY)==='1'?'checked':''}>数据修改后自动同步</label><div class="item-sub" id="driveNote" style="margin-top:9px">云端文件：${driveFileId?'已关联':'尚未关联'}。首次授权后通常不需要反复选择账号。</div></div>`;
html+=`<div class="card"><div class="section-head"><div class="round">▣</div><div><h2>数据管理</h2><p>备份、恢复或导出你的睡眠数据</p></div></div><button class="data-tool" id="exportJson"><span class="tool-icon">📦</span><span>导出 JSON<small>备份全部数据，可完整恢复</small></span></button><button class="data-tool" id="importJson"><span class="tool-icon">📥</span><span>导入 JSON<small>从备份文件恢复</small></span></button><button class="data-tool" id="exportCsv"><span class="tool-icon">📊</span><span>导出 CSV<small>历史记录，可用 Excel 打开</small></span></button><button class="data-tool danger-tool" id="clearAll"><span class="tool-icon">🗑</span><span>清空所有数据<small>包括当前记录和历史记录</small></span></button></div>`;
html+=`<div class="card"><div class="section-head"><div class="round">ⓘ</div><div><h2>应用</h2><p>版本和本地存储信息</p></div></div><div class="setting-row"><div class="setting-label"><strong>应用版本</strong><span>当前 PWA 版本</span></div><div class="setting-value">${APP_VERSION}</div></div><div class="setting-row"><div class="setting-label"><strong>数据存储</strong><span>浏览器本地 + Google Drive</span></div></div><div class="setting-row"><div class="setting-label"><strong>PWA</strong><span>扁平结构 · 手机优先</span></div><div class="setting-value">已支持</div></div></div>`;$('page-settings').innerHTML=html;bindSettings()}
function bindSettings(){$('saveLong').onclick=()=>{setLongTarget($('longH').value,$('longM').value);renderAll();toast('长期睡眠目标已保存')};$('driveConnect').onclick=driveConnect;$('driveDisconnect').onclick=driveDisconnect;$('driveUpload').onclick=()=>driveUpload(true,true);$('driveDownload').onclick=driveDownload;$('driveAutoSync').onchange=e=>{localStorage.setItem(DRIVE_AUTO_KEY,e.target.checked?'1':'0');if(e.target.checked)driveScheduleAutoSync()};$('exportJson').onclick=exportJson;$('importJson').onclick=()=>$('importFile').click();$('exportCsv').onclick=exportCsv;$('clearAll').onclick=clearAllData}
function exportJson(){const payload={schema:'sleep-calculator-sync-v1',appVersion:APP_VERSION,updatedAt:new Date().toISOString(),current:state.current,history:state.history,longTerm:{hours:Number(localStorage.getItem(LONG_H_KEY)||8),minutes:Number(localStorage.getItem(LONG_M_KEY)||15)}};download(`sleep-calculator-${localDate()}.json`,JSON.stringify(payload,null,2),'application/json');toast('JSON 已导出')}
$('importFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(String(r.result));if(!Array.isArray(d.history))throw new Error('备份文件格式不正确');if(!confirm(`准备导入 ${d.history.length} 条睡眠记录，导入后会覆盖本机数据。确定继续吗？`))return;state.history=normalizeHistory(d.history);state.current=d.current&&typeof d.current==='object'?d.current:null;if(d.longTerm){setLongTarget(d.longTerm.hours,d.longTerm.minutes)}saveCurrent();saveHistory();renderAll();toast('数据已导入')}catch(err){alert(err.message||'导入失败')}finally{e.target.value=''}};r.readAsText(f)})
function exportCsv(){if(!state.history.length){alert('目前没有历史记录');return}const head=['日期','主睡眠开始','主睡眠结束','主睡眠','起夜清醒','午睡总时长','实际总睡眠','目标','盈亏'];const rows=state.history.map(e=>[e.date,fmtDT(e.start),fmtDT(e.end),dur(e.mainSleepMinutes||0),dur(e.awakeMinutes||0),dur((e.naps||[]).reduce((s,n)=>s+(Number(n.minutes)||0),0)),e.sleepDuration,dur(e.targetMinutes||longTarget()),signedDur((parseDuration(e.sleepDuration)||0)-(e.targetMinutes||longTarget()))]);const csv='\ufeff'+[head,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');download(`sleep-history-${localDate()}.csv`,csv,'text/csv;charset=utf-8');toast('CSV 已导出')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function clearAllData(){if(!confirm('确定清空全部睡眠数据吗？'))return;if(!confirm('这是不可撤销操作，确定继续吗？'))return;localStorage.removeItem(CURRENT_KEY);localStorage.removeItem(HISTORY_KEY);state.current=null;state.history=[];renderAll();toast('全部数据已清空')}
// Google Drive
function driveTokenValid(){return !!driveToken&&Date.now()<driveTokenExpiresAt-60000}
function driveEnsureGIS(){if(window.google?.accounts?.oauth2)return Promise.resolve();if(driveGISPromise)return driveGISPromise;driveGISPromise=new Promise((resolve,reject)=>{const old=document.querySelector('script[data-google-gis]');if(old){old.addEventListener('load',resolve);old.addEventListener('error',reject);return}const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;s.dataset.googleGis='1';s.onload=resolve;s.onerror=()=>reject(new Error('Google Identity Services 加载失败'));document.head.appendChild(s)});return driveGISPromise}
async function driveGetToken(interactive=true){if(driveTokenValid())return driveToken;await driveEnsureGIS();return new Promise((resolve,reject)=>{let settled=false;const client=google.accounts.oauth2.initTokenClient({client_id:DRIVE_CLIENT_ID,scope:DRIVE_SCOPE,callback:r=>{if(r.error){settled=true;reject(new Error(r.error_description||r.error));return}driveToken=r.access_token;driveTokenExpiresAt=Date.now()+Number(r.expires_in||3600)*1000;settled=true;resolve(driveToken)},error_callback:e=>{if(!settled)reject(new Error(e?.message||'Google 登录窗口未完成'))}});client.requestAccessToken({prompt:interactive?'':' ' .trim()})})}
async function driveFetch(url,opt={}){let token=await driveGetToken(opt.interactive!==false);const h=new Headers(opt.headers||{});h.set('Authorization','Bearer '+token);let r=await fetch(url,{...opt,headers:h});if(r.status===401){driveToken=null;driveTokenExpiresAt=0;token=await driveGetToken(opt.interactive!==false);h.set('Authorization','Bearer '+token);r=await fetch(url,{...opt,headers:h})}if(!r.ok){let msg=`HTTP ${r.status}`;try{const x=await r.json();msg=x.error?.message||msg}catch{}throw new Error(msg)}return r}
function drivePayload(){return {schema:'sleep-calculator-sync-v1',appVersion:APP_VERSION,updatedAt:new Date().toISOString(),current:state.current,history:state.history,longTerm:{hours:Number(localStorage.getItem(LONG_H_KEY)||8),minutes:Number(localStorage.getItem(LONG_M_KEY)||15)}}}
function driveSetStatus(t,type=''){const e=$('driveStatus');if(e){e.className='status '+(type==='ok'?'ok':type==='error'?'error':'');e.textContent=t}const n=$('driveNote');if(n&&type==='error')n.textContent='同步失败：'+t}
async function driveFindFile(){const q=`name='${DRIVE_FILE_NAME}' and trashed=false`;const r=await driveFetch('https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({q,spaces:'drive',fields:'files(id,name,modifiedTime)',pageSize:'10'}),{interactive:false});const d=await r.json();const f=d.files?.[0]||null;driveFileId=f?.id||driveFileId;if(driveFileId)localStorage.setItem(DRIVE_FILE_KEY,driveFileId);return f}
async function driveUpload(show=true,interactive=true){if(driveBusy)return;driveBusy=true;driveSetStatus('正在同步到 Google Drive…');try{await driveGetToken(interactive);const f=await driveFindFile();const text=JSON.stringify(drivePayload(),null,2);if(f){driveFileId=f.id;await driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(f.id)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:text,interactive})}else{const boundary='sleepSyncBoundary'+Date.now();const meta={name:DRIVE_FILE_NAME,mimeType:'application/json'};const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+text+'\r\n--'+boundary+'--';const r=await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body,interactive});const d=await r.json();driveFileId=d.id;localStorage.setItem(DRIVE_FILE_KEY,driveFileId)}driveSetStatus('已同步到 Google Drive · '+new Date().toLocaleString(),'ok');if(show)toast('睡眠数据已同步到 Google Drive')}catch(e){driveSetStatus(e.message||String(e),'error');if(show)alert('Google Drive 同步失败：'+(e.message||e))}finally{driveBusy=false}}
async function driveDownload(){if(driveBusy)return;driveBusy=true;driveSetStatus('正在从 Google Drive 下载…');try{await driveGetToken(true);const f=await driveFindFile();if(!f){alert('Google Drive 中还没有睡眠同步文件，请先在一台设备上传/同步。');driveSetStatus('已连接 · 尚未创建云端文件','error');return}const r=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(f.id)+'?alt=media',{interactive:true});const d=await r.json();if(d.schema!=='sleep-calculator-sync-v1'||!Array.isArray(d.history))throw new Error('云端文件格式不正确');if(!confirm(`云端有 ${d.history.length} 条睡眠记录。\n\n恢复后会覆盖本机当前数据。\n\n确定继续吗？`))return;state.history=normalizeHistory(d.history);state.current=d.current&&typeof d.current==='object'?d.current:null;if(d.longTerm)setLongTarget(d.longTerm.hours,d.longTerm.minutes);saveCurrent();localStorage.setItem(HISTORY_KEY,JSON.stringify(state.history));driveSetStatus('已从 Google Drive 恢复','ok');renderAll();toast('云端数据已恢复')}catch(e){driveSetStatus(e.message||String(e),'error');alert('Google Drive 恢复失败：'+(e.message||e))}finally{driveBusy=false}}
function driveDisconnect(){driveToken=null;driveTokenExpiresAt=0;driveSetStatus('未连接');toast('已断开当前连接')}
function driveScheduleAutoSync(){if(localStorage.getItem(DRIVE_AUTO_KEY)!=='1'||!driveFileId||!driveTokenValid())return;clearTimeout(driveAutoTimer);driveAutoTimer=setTimeout(()=>driveUpload(false,false),1200)}
// init
if(!localStorage.getItem(LONG_H_KEY))setLongTarget(8,15);if(!state.history.length&&localStorage.getItem(HISTORY_KEY))state.history=loadHistory();
renderAll();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('./sw.js?v=10.0',{updateViaCache:'none'});await reg.update();if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!sessionStorage.getItem('sleep-sw-reloaded-v10.0')){sessionStorage.setItem('sleep-sw-reloaded-v10.0','1');location.reload()}})}catch(e){console.warn(e)}})}
</script>
</body></html>
